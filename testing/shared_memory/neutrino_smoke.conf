#########################################################################################
# Minimal neutrino IC config for the shared-memory FastDF regression test.
# NeutrinoGridRes is deliberately small (8) so that the "more node-local ranks than
# grid x-planes" layout (e.g. mpirun -np 9) is exercised.  FILENAME is substituted
# by run_tests.sh so every layout writes to a distinct output file.
#########################################################################################
[setup]
GridRes         = 16
BoxLength       = 300
zstart          = 24.0
LPTorder        = 1
DoBaryons       = no
DoBaryonVrel    = no
DoFixing        = no
DoInversion     = no
ParticleLoad    = sc
DoDensityVelocityCorr = no

WithNeutrinos   = yes
DoNeutrinoParticles = yes
NeutrinoCubeRootNum = 8
NeutrinoGridRes = 8
NeutrinoStepSize = 0.05
NeutrinoInterpOrder = 1

[cosmology]
ParameterSet    = Planck2018EE+BAO+SN
transfer        = zwindstroom
ztarget         = 0.0

[random]
generator       = NGENIC
seed            = 12345

[execution]
NumThreads      = 1

[output]
format          = gadget_hdf5
filename        = FILENAME
